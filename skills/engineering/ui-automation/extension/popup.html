<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ui-automation</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="brand">
      <img src="icons/bridge-128.png" width="48" height="48" alt="">
      <div>
        <h1>ui-automation</h1>
        <p>本机桥接</p>
      </div>
    </header>

    <section class="connection" aria-label="本机桥接">
      <div id="status" role="status">
        <div class="status-line">
          <h2>本机连接</h2>
          <strong class="badge"><span class="dot" aria-hidden="true"></span><span id="connection">检查中</span></strong>
        </div>
        <p id="description">正在读取本机桥接状态。</p>
      </div>
      <dl class="sessions">
        <dt>活动会话</dt>
        <dd id="sessions">—</dd>
      </dl>
    </section>

    <button id="connect" type="button" disabled>连接本机桥接</button>

    <footer>
      <details id="diagnostics" hidden>
        <summary>错误详情</summary>
        <p id="error"></p>
      </details>
      <button id="reload" type="button">重载扩展</button>
    </footer>
  </main>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
