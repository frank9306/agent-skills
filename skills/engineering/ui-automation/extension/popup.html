<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI Automation</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>UI Automation</h1>
      <button id="reload" class="secondary" type="button">重载插件</button>
    </header>
    <section class="connection" aria-label="本机连接">
      <div id="status" role="status">
        <div class="status-line"><span class="dot" aria-hidden="true"></span><strong id="connection">正在检查连接</strong></div>
        <p id="description">正在读取本机桥接状态。</p>
      </div>
      <div class="sessions"><span>活动会话</span><strong id="sessions">—</strong></div>
    </section>
    <button id="connect" type="button" disabled>连接本机桥接</button>
    <details id="diagnostics" hidden>
      <summary>查看错误详情</summary>
      <p id="error"></p>
    </details>
  </main>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
